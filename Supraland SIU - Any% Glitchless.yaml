  # Splits for each pickaxe tier upgrade, which can be toggled on or off in the settings.
  pickaxe_tiers:
    setting:
      name: Pickaxe Upgrades
      desc: Splits triggered by picking up a new pickaxe tier.
      default: true
    entries:
    - key: PickaxeWood
      type: byte_increasing
      watcher: pickaxe_tier
      target: 1
      setting:
        name: Wooden Pickaxe
        desc: Split on getting the wooden pickaxe.
        default: true
    - key: PickaxeStone
      type: byte_increasing
      watcher: pickaxe_tier
      target: 2
      setting:
        name: Stone Pickaxe
        desc: Split on getting the stone pickaxe.
        default: true
    - key: PickaxeIron
      type: byte_increasing
      watcher: pickaxe_tier
      target: 3
      setting:
        name: Iron Pickaxe
        desc: Split on getting the iron pickaxe.
        default: false
    - key: PickaxeDiamond
      type: byte_increasing
      watcher: pickaxe_tier
      target: 4
      setting:
        name: Diamond Pickaxe
        desc: Split on getting the diamond pickaxe.
        default: false
  # Splits for specific area transitions, which can be toggled on or off in the settings.
  area_transitions:
    setting:
      name: Area Transitions
      desc: Splits triggered by entering a new major area for the first time.
      default: true
    entries:
    - key: MinesToCage
      type: byte_transition
      watcher: area
      from: 1
      to: 2
      setting:
        name: Mines to Cage
        desc: Split on going from the Mines area to the Cage area for the first time.
        default: false
    - key: CageToFactory
      type: byte_transition
      watcher: area
      from: 2
      to: 3
      setting:
        name: Cage to Factory
        desc: Split on going from the Cage area to the Factory area for the first time.
        default: true
    - key: CageToBank
      type: byte_transition
      watcher: area
      from: 2
      to: 4
      setting:
        name: Cage to Bank
        desc: Split on going from the Cage area to the Bank area for the first time.
        default: true
    - key: CageToBeach
      type: byte_transition
      watcher: area
      from: 2
      to: 5
      setting:
        name: Cage to Beach
        desc: Split on going from the Cage area to the Beach area for the first time.
        default: true
    - key: BeachToCastle
      type: byte_transition
      watcher: area
      from: 5
      to: 8
      setting:
        name: Beach to Castle
        desc: Split on going from the Beach area to the Castle area for the first time.
        default: true
    - key: CastleToCage
      type: byte_transition
      watcher: area
      from: 8
      to: 2
      setting:
        name: Castle to Cage
        desc: Split on going from the Castle area to the Cage area for the first time.
        default: false
  # Splits driven by booleans read relative to a dynamic_pointers entry, resolved at runtime.
  dynamic_flags:
    setting:
      name: Dynamic Flags
      desc: Splits triggered by flags on dynamically resolved objects.
      default: true
    entries:
    - key: BossFightStart
      type: dynamic_bool_set
      base_pointer: boss_enemy
      offset: 0xc88
      setting:
        name: Boss Fight Start
        desc: Split on the final boss entering aggro mode.
        default: true
    - key: BossFightComplete
      type: dynamic_bool_set
      base_pointer: boss_enemy
      offset: 0xd44
      setting:
        name: Boss Fight Complete
        desc: Split on defeating the final boss.
        default: true
